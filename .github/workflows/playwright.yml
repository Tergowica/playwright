name: Playwright Tests

on:
  # Uruchamia workflow po pushu na każdy branch
  push:

  # Uruchamia workflow przy pull requestach
  pull_request:

  # Pozwala odpalić ręcznie z GitHuba:
  # GitHub → Actions → Playwright Tests → Run workflow
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60

    # GitHub najpierw uruchamia runnera Ubuntu
    runs-on: ubuntu-latest

    # WERSJA DOCKEROWA:
    # Job odpala się w gotowym obrazie Playwrighta.
    # Wersja musi pasować do wersji @playwright/test z projektu.
    # U Ciebie z loga wynikało: required v1.58.2-noble
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    env:
      # Potrzebne dla Firefoxa w Dockerze,
      # bo inaczej Firefox krzyczy, że HOME wskazuje na /github/home
      HOME: /root

      # Usuwa warning:
      # Error loading config file: open /root/.docker/config.json: permission denied
      DOCKER_CONFIG: /tmp/.docker

    steps:
      # Pobiera kod repozytorium
      - uses: actions/checkout@v4

      # WERSJA BEZ DOCKERA:
      # Tego używasz tylko wtedy, gdy usuniesz sekcję "container".
      # W Dockerze Playwrighta Node.js już jest w obrazie.
      #
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: lts/*

      # Tworzy katalog na config Dockera, żeby nie było warninga z /root/.docker/config.json
      - name: Prepare Docker config dir
        run: mkdir -p /tmp/.docker

      # Instaluje zależności projektu według package-lock.json
      # To zostaje i w Dockerze, i bez Dockera
      - name: Install dependencies
        run: npm ci

      # WERSJA BEZ DOCKERA:
      # Tego używasz tylko bez sekcji "container".
      # W Dockerowym obrazie Playwrighta przeglądarki już są.
      #
      # - name: Install Playwright Browsers
      #   run: npx playwright install --with-deps

      # Kontrolnie pokazuje HOME.
      # Jak wszystko będzie działało, możesz to potem usunąć.
      - name: Check HOME
        run: echo $HOME

      # Na razie polecam odpalić tylko Chromium,
      # żeby testować CI/Docker bez mnożenia błędów z Firefox/WebKit.
      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      # Jak już poprawisz testy, możesz wrócić do pełnego uruchamiania:
      #
      # - name: Run Playwright tests
      #   run: npx playwright test

      # Zapisuje raport Playwrighta jako artifact w GitHub Actions
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30