name: Playwright Tests

on:
  push:
  #  branches: [ main, master ]
  pull_request:
  #  branches: [ main, master ]

  # Pozwala odpalić workflow ręcznie z zakładki Actions na GitHubie.
  # Możesz zostawić, przydaje się do testów.
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # DOCKER:
    # Ten kontener ma już środowisko pod Playwrighta,
    # czyli przeglądarki i zależności systemowe.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    steps:
    - uses: actions/checkout@v4

    # NIEPOTRZEBNE W WERSJI DOCKEROWEJ:
    # Obraz Playwrighta ma już Node.js.
    # Jak będziesz chciał wrócić do wersji bez Dockera, odkomentuj.
    # - uses: actions/setup-node@v4
    #   with:
    #     node-version: lts/*

    - name: Install dependencies
      run: npm ci

    # NIEPOTRZEBNE W WERSJI DOCKEROWEJ:
    # Oficjalny obraz Playwrighta ma już przeglądarki i zależności systemowe.
    # Jak będziesz chciał wrócić do wersji bez Dockera, odkomentuj.
    # - name: Install Playwright Browsers
    #   run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30